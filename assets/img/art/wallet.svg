<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 4 70 64" width="70" height="64">
  <!-- Wallet — brown leather, cash and cards peeking out. -->
  <defs>
    <linearGradient id="wl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A25A36"/>
      <stop offset="1" stop-color="#7A3C20"/>
    </linearGradient>
    <linearGradient id="wl-strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E4A2A"/>
      <stop offset="1" stop-color="#6C331A"/>
    </linearGradient>
  </defs>
  <ellipse cx="40" cy="64.6" rx="27" ry="2.4" fill="#1A0E06" opacity=".09"/>
  <!-- back panel, visible through the opening -->
  <rect x="13" y="22" width="51" height="41" rx="7" fill="#5E2C15"/>
  <!-- cash -->
  <g transform="rotate(-9 42 22)">
    <rect x="23" y="9" width="38" height="24" rx="2" fill="#A8C68E"/>
    <rect x="25.6" y="11.6" width="32.8" height="18.8" rx="1.4" fill="none" stroke="#6E9557" stroke-width="1.2"/>
    <circle cx="42" cy="21" r="3.6" fill="none" stroke="#6E9557" stroke-width="1.2"/>
  </g>
  <!-- cards -->
  <rect x="19" y="17" width="34" height="22" rx="2.6" fill="#C8744A" transform="rotate(-5 36 28)"/>
  <rect x="17" y="21.6" width="34" height="22" rx="2.6" fill="#3E7A5C" transform="rotate(-2.5 34 32)"/>
  <rect x="21" y="25.2" width="6.2" height="4.6" rx="1" fill="#E6C25B" transform="rotate(-2.5 34 32)"/>
  <!-- front -->
  <rect x="11" y="30" width="54" height="34" rx="7" fill="url(#wl-body)"/>
  <rect x="14.2" y="33.2" width="47.6" height="27.6" rx="4.6" fill="none" stroke="#D39068" stroke-width=".9" stroke-dasharray="2 1.8" opacity=".75"/>
  <path d="M18 30h40" stroke="#5E2C15" stroke-width="1.2" opacity=".35"/>
  <!-- strap and snap -->
  <rect x="52" y="39" width="20" height="15" rx="6" fill="url(#wl-strap)"/>
  <rect x="54.4" y="41.4" width="15.2" height="10.2" rx="4" fill="none" stroke="#D39068" stroke-width=".8" stroke-dasharray="1.8 1.6" opacity=".7"/>
  <circle cx="65" cy="46.5" r="2.9" fill="#EAB85A" stroke="#9A6424" stroke-width=".8"/>
  <g fill="none" stroke="#6F8F4C" stroke-width="2" stroke-linecap="round">
    <path d="M70.2 20.6l2-3.8"/>
    <path d="M72.8 26.4l4-2.2"/>
    <path d="M73 32.6l4.2.4"/>
  </g>
</svg>
