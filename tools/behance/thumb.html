<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klaxs · Behance cover</title>
<!-- The Behance project cover, 808 × 632. tools/behance/render.js draws it. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 808px; height: 632px; overflow: hidden; font-family: "Plus Jakarta Sans", sans-serif; color: #14141A; -webkit-font-smoothing: antialiased; }
  /* the logo's own tile is this flat orange, so the logo sits on it seamlessly */
  .cover { width: 808px; height: 632px; display: grid; grid-template-columns: 1fr 438px; background: #F5A93A; }
  .words { display: flex; flex-direction: column; justify-content: center; padding: 0 30px 0 34px; }
  .logo { display: block; width: 300px; height: 300px; margin: -40px 0 -36px -30px; }
  h1 { font-size: 46px; line-height: 1.02; letter-spacing: -.035em; font-weight: 800; }
  .tag { align-self: flex-start; margin-top: 26px; padding: 9px 18px; background: #FFF3DC; border: 2.5px solid #14141A; border-radius: 999px; box-shadow: 3px 3px 0 #14141A; font-size: 17px; font-weight: 800; }
  .by { margin-top: 26px; font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .me { width: 438px; height: 632px; object-fit: cover; object-position: 50% 0; border-left: 3px solid #14141A; }
</style>
</head>
<body>
<div class="cover">
  <div class="words">
    <img class="logo" src="../../assets/img/vibe/klaxs.webp" alt="Klaxs">
    <h1>Learn to Speak Horn</h1>
    <span class="tag">UX · Product Design</span>
    <p class="by">Mariam Emad Nabih</p>
  </div>
  <img class="me" src="../../assets/img/klaxs/me-in-klaxs.webp" alt="">
</div>
</body>
</html>
