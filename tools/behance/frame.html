<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klaxs · video frame</title>
<!--
  The 1920×1080 frame a screen recording sits in, styled like the case study
  on the site, so a video reads as one more part of the page. It is drawn as
  two layers by tools/behance/frame-video.js: ?layer=back is the paper and the
  words, ?layer=front is only the phone's bezel, transparent everywhere else.
  The video goes between them, so the bezel's rounded corners crop it.
-->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.back { background: var(--paper); }
  body.front { background: transparent; }
  .front .words, .back .bezel { display: none; }
  .words { position: absolute; left: 160px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  /* the site's section heading: the number in blue mono, then the title */
  h1 { font-size: 76px; line-height: 1.08; letter-spacing: -.035em; font-weight: 800; }
  h1 span { display: inline-block; margin-right: .45em; font-family: var(--font-mono); font-size: .6em; font-weight: 600; color: var(--blue); vertical-align: .12em; letter-spacing: 0; }
  /* a line of the game's own copy, like the quotes in the study */
  .said { margin-top: 44px; padding: 6px 0 6px 32px; border-left: 4px solid var(--mustard); }
  .ar { font-family: var(--font-ar); font-size: 50px; font-weight: 700; line-height: 1.45; width: fit-content; max-width: 100%; }
  .sub { margin-top: 36px; font-size: 32px; line-height: 1.55; color: var(--ink-soft); max-width: 800px; }
  .bezel { position: absolute; border: 18px solid var(--ink); }
  .back .shadow { position: absolute; border-radius: 64px; box-shadow: 0 18px 36px rgba(20,20,26,.16); }
  /* a landscape recording: the title becomes a strip above it */
  .wide .words { left: 0; right: 0; width: auto; top: 64px; bottom: auto; align-items: center; text-align: center; }
  .wide h1 { font-size: 54px; }
  .wide .said, .wide .sub { display: none; }
</style>
</head>
<body>
<div class="words">
  <h1><span id="num"></span><b id="title" style="font-weight: inherit"></b></h1>
  <div class="said" id="said"><p class="ar" lang="ar" dir="rtl" id="ar"></p></div>
  <p class="sub" id="sub"></p>
</div>
<div class="shadow" id="shadow"></div>
<div class="bezel" id="bezel"></div>
<script>
  var q = new URLSearchParams(location.search);
  document.body.className = q.get('layer') + (q.get('wide') ? ' wide' : '');
  ['num', 'title', 'ar', 'sub'].forEach(function (k) {
    var el = document.getElementById(k);
    if (q.get(k)) el.textContent = q.get(k); else el.style.display = 'none';
  });
  if (!q.get('ar')) document.getElementById('said').style.display = 'none';
  // the bezel wraps the video's box, whose place frame-video.js decides; the
  // shadow is drawn on the back layer, so it falls on the paper, not the video
  var b = 18, x = +q.get('x'), y = +q.get('y'), w = +q.get('w'), h = +q.get('h');
  var r = (q.get('wide') ? 28 : 64) + 'px';
  ['bezel', 'shadow'].forEach(function (id) {
    var s = document.getElementById(id).style;
    s.left = (x - b) + 'px'; s.top = (y - b) + 'px';
    s.width = (w + 2 * b) + 'px'; s.height = (h + 2 * b) + 'px';
    s.borderRadius = r;
  });
</script>
</body>
</html>
