<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klaxs · video frame</title>
<!--
  The 1920×1080 frame a screen recording sits in, drawn as two layers by
  tools/behance/frame-video.js: ?layer=back is the sand page and the words,
  ?layer=front is only the phone's bezel, transparent everywhere else. The
  video goes between them, so the bezel's rounded corners crop it.
-->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: #14141A; -webkit-font-smoothing: antialiased; }
  body.back { background: #FFF3DC; }
  body.front { background: transparent; }
  .front .words, .back .bezel { display: none; }
  .words { position: absolute; left: 150px; top: 0; bottom: 0; width: 960px; display: flex; flex-direction: column; justify-content: center; }
  .hd { display: flex; align-items: center; gap: 18px; }
  .num { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: .08em; background: #EDA836; border: 3px solid #14141A; border-radius: 999px; padding: 7px 22px; }
  .kicker { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #5A5A66; }
  h1 { margin-top: 34px; font-size: 84px; line-height: 1.02; letter-spacing: -.04em; font-weight: 800; }
  .ar { margin-top: 30px; font-family: "Baloo Bhaijaan 2", sans-serif; font-size: 52px; font-weight: 800; line-height: 1.4; color: #14141A; width: fit-content; }
  .sub { margin-top: 26px; font-size: 32px; line-height: 1.5; color: #3A3A45; max-width: 760px; }
  .bezel { position: absolute; border: 18px solid #14141A; box-shadow: 0 30px 60px rgba(20,20,26,.22); }
  /* a landscape recording: the words become a strip above it */
  .wide .words { left: 0; right: 0; width: auto; top: 70px; bottom: auto; align-items: center; text-align: center; }
  .wide h1 { margin-top: 18px; font-size: 56px; }
  .wide .ar, .wide .sub { display: none; }
</style>
</head>
<body>
<div class="words">
  <div class="hd"><span class="num" id="num"></span><span class="kicker">Klaxs · كلاكس</span></div>
  <h1 id="title"></h1>
  <p class="ar" lang="ar" dir="rtl" id="ar"></p>
  <p class="sub" id="sub"></p>
</div>
<div class="bezel" id="bezel"></div>
<script>
  var q = new URLSearchParams(location.search);
  document.body.className = q.get('layer') + (q.get('wide') ? ' wide' : '');
  ['num', 'title', 'ar', 'sub'].forEach(function (k) {
    var el = document.getElementById(k);
    if (q.get(k)) el.textContent = q.get(k); else el.style.display = 'none';
  });
  // the bezel wraps the video's box, whose place frame-video.js decides
  var b = 18, x = +q.get('x'), y = +q.get('y'), w = +q.get('w'), h = +q.get('h');
  var s = document.getElementById('bezel').style;
  s.left = (x - b) + 'px'; s.top = (y - b) + 'px';
  s.width = (w + 2 * b) + 'px'; s.height = (h + 2 * b) + 'px';
  s.borderRadius = (q.get('wide') ? 28 : 64) + 'px';
</script>
</body>
</html>
