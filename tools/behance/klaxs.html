<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klaxs · Behance panels</title>
<!--
  The Klaxs case study laid out as Behance image modules, one <section> per
  image, 1400px wide. Every word comes from assets/js/data.js, so the Behance
  version says exactly what the site says. tools/behance/render.js turns each
  section into a PNG in behance/klaxs/.
-->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
  :root {
    --sand: #FFF3DC; --sand-deep: #F6E4C1; --mustard: #EDA836;
    --ink: #14141A; --ink-soft: #3A3A45; --muted: #5A5A66;
    --line: #E6D3AE; --card: #FFFBF2;
    --red: #C4462B; --green: #5E7D33;
    --sans: "Plus Jakarta Sans", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ar: "Baloo Bhaijaan 2", "Noto Sans Arabic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .panel { width: 1400px; background: var(--sand); padding: 120px 120px; position: relative; overflow: hidden; margin-bottom: 40px; }
  .panel--dark { background: var(--ink); color: #F4F2EE; }
  .panel--tight { padding-top: 40px; }
  b { font-weight: 800; color: var(--ink); }
  .panel--dark b { color: #fff; }
  .ar { font-family: var(--ar); font-weight: 700; }
  [dir=rtl] { font-family: var(--ar); }

  /* section header */
  .hd { display: flex; align-items: center; gap: 18px; }
  .num { font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: .08em;
         background: var(--mustard); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 18px; }
  .kicker { font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h2 { margin-top: 26px; font-size: 68px; line-height: 1.04; letter-spacing: -.035em; font-weight: 800; max-width: 1000px; }
  .intro { margin-top: 26px; font-size: 26px; line-height: 1.55; color: var(--ink-soft); max-width: 980px; }
  p.body { font-size: 24px; line-height: 1.65; color: var(--ink-soft); }
  p.body + p.body { margin-top: 22px; }

  /* hero */
  .hero { padding: 0; }
  .hero__img { display: block; width: 1400px; height: 735px; object-fit: cover; }
  .hero__in { padding: 90px 120px 120px; }
  .hero h1 { margin-top: 26px; font-size: 92px; line-height: .98; letter-spacing: -.045em; font-weight: 800; }
  .hero h1 em { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: -.02em; }
  .hero .stand { margin-top: 34px; font-size: 30px; line-height: 1.5; color: var(--ink-soft); max-width: 1040px; }
  .meta { margin-top: 70px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2.5px solid var(--ink); }
  .meta div { padding: 26px 22px 0 0; }
  .meta dt { font-family: var(--mono); font-size: 16px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .meta dd { margin-top: 10px; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .meta small { display: block; margin-top: 6px; font-size: 17px; line-height: 1.4; color: var(--muted); }

  /* 01 */
  .split { display: grid; grid-template-columns: 1fr 470px; gap: 90px; align-items: start; margin-top: 50px; }
  .shot { display: block; filter: drop-shadow(0 18px 30px rgba(20,20,26,.18)); }
  figure figcaption { margin-top: 18px; font-size: 19px; color: var(--muted); font-style: italic; }
  .me { width: 470px; border-radius: 26px; border: 3px solid var(--ink); }

  /* pull */
  .pull { text-align: center; padding: 160px 140px; }
  .pull__ar { font-family: var(--ar); font-size: 96px; line-height: 1.4; font-weight: 800; color: var(--mustard); }
  .pull__en { margin-top: 24px; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 1.15; }
  .pull__en:only-child { font-size: 82px; }

  /* horns */
  .horns { margin-top: 56px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .horn { background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; padding: 34px 32px 32px; box-shadow: 6px 6px 0 var(--ink); }
  .horn--listen { border-style: dashed; box-shadow: none; background: transparent; }
  .horn__ar { width: fit-content; max-width: 100%; margin-top: 26px; font-size: 44px; line-height: 1.3; font-weight: 800; }
  .horn__en { margin-top: 4px; font-size: 22px; font-weight: 800; color: var(--ink-soft); }
  .horn__when { margin-top: 12px; font-size: 19px; line-height: 1.5; color: var(--muted); }
  .horn__tag { display: inline-block; margin-top: 18px; padding: 5px 14px; border: 2px solid var(--red); color: var(--red); border-radius: 999px; font-size: 16px; font-weight: 800; }
  .beeps { display: flex; align-items: center; gap: 8px; height: 30px; direction: ltr; }
  .beeps i { display: block; width: 26px; height: 26px; background: var(--mustard); border: 2.5px solid var(--ink); border-radius: 999px; }
  .beeps i.L { width: 84px; }
  .beeps i.p { width: 14px; background: none; border: 0; }
  .beeps span { margin-left: 8px; font-family: var(--mono); font-size: 18px; font-weight: 600; }

  /* chips */
  .chips { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 18px; }
  .chip { font-size: 28px; font-weight: 800; padding: 18px 30px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--card); }
  .chip--accent { background: var(--mustard); }
  .chip small { font-weight: 600; font-size: 20px; color: var(--ink-soft); margin-left: 8px; }

  /* steps */
  .steps { margin-top: 64px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; list-style: none; padding: 0; }
  .steps img { width: 100%; height: auto; }
  .step__n { margin-top: 26px; font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--muted); }
  .step__t { margin-top: 6px; font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
  .step__p { margin-top: 10px; font-size: 17.5px; line-height: 1.55; color: var(--ink-soft); }

  /* decision */
  .dec { display: grid; grid-template-columns: 420px 1fr; gap: 110px; align-items: center; margin-top: 60px; }
  .dec--flip { grid-template-columns: 1fr 420px; }
  .dec--flip .dec__img { order: 2; }
  .dec__img img { width: 420px; height: auto; }
  .concept { display: inline-block; font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; background: var(--ink); color: var(--sand); padding: 8px 14px; border-radius: 8px; }
  .dec__count { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--muted); margin-left: 14px; }
  .dec h3 { margin-top: 24px; font-size: 52px; line-height: 1.08; letter-spacing: -.03em; font-weight: 800; }
  .dec p.body { margin-top: 26px; font-size: 23px; }
  .said { margin-top: 40px; padding: 26px 30px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; position: relative; }
  .said__ar { font-size: 34px; line-height: 1.5; font-weight: 800; width: fit-content; max-width: 100%; }
  .said__en { margin-top: 6px; font-family: var(--serif); font-style: italic; font-size: 28px; color: var(--ink-soft); }
  .said__by { margin-top: 10px; font-size: 17px; font-weight: 700; color: var(--muted); }

  /* copy */
  .copy { margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .cp { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 30px 32px; }
  .cp--wide { grid-column: 1 / -1; }
  .cp__where { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .cp__ar { margin-top: 14px; font-size: 34px; line-height: 1.45; font-weight: 800; width: fit-content; max-width: 100%; }
  .cp__en { margin-top: 2px; font-family: var(--serif); font-style: italic; font-size: 27px; line-height: 1.25; }
  .cp__why { margin-top: 14px; padding-top: 14px; border-top: 1.5px dashed var(--line); font-size: 18px; line-height: 1.55; color: var(--ink-soft); }

  /* feedback */
  .fb { margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .fb--masonry { display: block; columns: 2; column-gap: 40px; }
  .fb--masonry .msg { break-inside: avoid; margin-bottom: 40px; }
  .msg__img { display: block; width: 100%; height: auto; border-radius: 22px; }
  .msg__en { margin-top: 20px; padding-left: 22px; border-left: 4px solid var(--mustard); }
  .msg__en p { font-family: var(--serif); font-style: italic; font-size: 27px; line-height: 1.35; }
  .msg__en p + p { margin-top: 8px; }
  .msg__note { margin-top: 16px; font-size: 19px; line-height: 1.55; color: var(--ink-soft); }

  /* outcome */
  .out { margin-top: 60px; }
  .out figure { margin: 80px auto 0; width: 470px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1.75fr; gap: 22px; }
  .stat { background: var(--card); border: 2.5px solid var(--ink); border-radius: 24px; padding: 30px 24px; box-shadow: 6px 6px 0 var(--ink); }
  .stat__v { font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -.045em; }
  .stat__l { margin-top: 14px; font-size: 18px; line-height: 1.5; color: var(--ink-soft); }
  .board { width: 470px; border-radius: 26px; border: 3px solid var(--ink); }

  /* closing */
  .learn { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .learn p { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 34px; font-size: 22px; line-height: 1.6; color: var(--ink-soft); }
  .end { margin-top: 110px; padding-top: 90px; border-top: 2.5px solid var(--ink); text-align: center; }
  .end__q { font-family: var(--serif); font-style: italic; font-size: 76px; line-height: 1.12; max-width: 1050px; margin: 0 auto; }
  .end__play { display: inline-flex; align-items: center; gap: 16px; margin-top: 64px; padding: 22px 40px; background: var(--mustard); border: 3px solid var(--ink); border-radius: 999px; font-size: 30px; font-weight: 800; box-shadow: 6px 6px 0 var(--ink); }
  .end__url { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .end__credit { margin-top: 56px; font-size: 20px; color: var(--muted); line-height: 1.6; }

  /* Behance cover, 808 × 632 */
  .thumb { width: 808px; height: 632px; padding: 0; margin-bottom: 40px; position: relative; overflow: hidden; background: var(--ink); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
</style>
</head>
<body>
<main id="out"></main>
<script src="../../assets/js/data.js"></script>
<script>
(function () {
  var cs = window.WORK.find(function (w) { return w.slug === 'klaxs'; });
  var out = document.getElementById('out');
  var IMG = '../../';
  var n = 0;
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var img = function (i, cls) {
    return '<img class="' + (cls || '') + '" src="' + IMG + i.src + '" width="' + i.width +
           '" height="' + i.height + '" alt="' + esc(i.alt || '') + '">';
  };
  // each panel becomes one Behance image module; the id is its file name
  function panel(name, html, cls) {
    n++;
    var id = String(n).padStart(2, '0') + '-' + name;
    out.insertAdjacentHTML('beforeend', '<section class="panel ' + (cls || '') + '" data-file="' + id + '">' + html + '</section>');
  }
  function head(b) {
    return '<div class="hd"><span class="num">' + b.num + '</span><span class="kicker">Klaxs · كلاكس</span></div>' +
           '<h2>' + b.title + '</h2>' + (b.intro ? '<p class="intro">' + b.intro + '</p>' : '');
  }
  function beeps(notation, repeat) {
    return '<div class="beeps">' + notation.trim().split(/\s+/).map(function (t) {
      return '<i class="' + (t === 'L' ? 'L' : t === '|' ? 'p' : 's') + '"></i>';
    }).join('') + (repeat ? '<span>' + repeat + '</span>' : '') + '</div>';
  }
  function said(l) {
    return '<figure class="said"><p class="said__ar" lang="ar" dir="rtl">' + l.ar + '</p>' +
           '<p class="said__en">' + l.en + '</p>' + (l.by ? '<p class="said__by">' + l.by + '</p>' : '') + '</figure>';
  }
  function msg(m) {
    return '<figure class="msg">' + img(m.image, 'msg__img') +
           '<div class="msg__en">' + m.en.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
           (m.note ? '<p class="msg__note">' + m.note + '</p>' : '') + '</figure>';
  }

  // the Behance project cover, uploaded separately from the modules
  out.insertAdjacentHTML('beforeend',
    '<section class="thumb" data-file="00-behance-cover">' + img(cs.cover.pair[0]) + '</section>');

  var meta = Object.keys(cs.meta).map(function (k) {
    return '<div><dt>' + k + '</dt><dd>' + cs.meta[k].value + '</dd><small>' + cs.meta[k].note + '</small></div>';
  }).join('');
  panel('hero',
    img(cs.cover.pair[0], 'hero__img') +
    '<div class="hero__in"><span class="kicker">Case study · ' + cs.card.tags.join(' · ') + '</span>' +
    '<h1>Klaxs: in Cairo,<br>the horn is <em>a language</em></h1>' +
    '<p class="stand">' + cs.standfirst + '</p><dl class="meta">' + meta + '</dl></div>', 'hero');

  cs.blocks.forEach(function (b, bi) {
    var next = cs.blocks[bi + 1];
    if (b.type === 'section' && b.num === '01') {
      var me = cs.cover.pair[1];
      panel('where-it-started', head(b) +
        '<div class="split"><div>' + b.body.map(function (p) { return '<p class="body">' + p + '</p>'; }).join('') + '</div>' +
        '<figure>' + img(me, 'me') + '<figcaption>' + me.caption + '</figcaption></figure></div>');
    } else if (b.type === 'pull') {
      // the closing line is set inside the last panel
      if (!next) return;
      panel('pull', '<div class="pull">' +
        (b.ar ? '<p class="pull__ar" lang="ar" dir="rtl">' + b.ar + '</p>' : '') +
        '<p class="pull__en">' + b.text + '</p></div>', 'panel--dark pull');
    } else if (b.type === 'horns') {
      panel('the-horn-vocabulary', head(b) + '<div class="horns">' + b.items.map(function (h) {
        return '<div class="horn' + (h.listen ? ' horn--listen' : '') + '">' + beeps(h.rhythm, h.repeat) +
          '<p class="horn__ar" lang="ar" dir="rtl">' + h.ar + '</p><p class="horn__en">' + h.en + '</p>' +
          '<p class="horn__when">' + h.when + '</p>' + (h.listen ? '<span class="horn__tag">' + h.listen + '</span>' : '') + '</div>';
      }).join('') + '</div>');
    } else if (b.type === 'chips') {
      panel('who-its-for', head(b) + '<div class="chips">' + b.items.map(function (c) {
        return typeof c === 'string' ? '<span class="chip">' + c + '</span>'
          : '<span class="chip' + (c.accent ? ' chip--accent' : '') + '">' + c.text + (c.note ? '<small>' + c.note + '</small>' : '') + '</span>';
      }).join('') + '</div>');
    } else if (b.type === 'steps') {
      panel('how-it-plays', head(b) + '<ol class="steps">' + b.items.map(function (s, i) {
        return '<li>' + img(s.image, 'shot') + '<p class="step__n">0' + (i + 1) + '</p><p class="step__t">' + s.title +
               '</p><p class="step__p">' + s.text + '</p></li>';
      }).join('') + '</ol>');
    } else if (b.type === 'decisions') {
      b.items.forEach(function (d, i) {
        var slug = d.concept.toLowerCase().replace(/[^a-z]+/g, '-').replace(/-$/, '');
        panel('ux-' + slug,
          (i === 0 ? head(b) : '') +
          '<div class="dec' + (i % 2 ? ' dec--flip' : '') + '">' +
          '<div class="dec__img">' + img(d.image, 'shot') + '</div>' +
          '<div><span class="concept">' + d.concept + '</span><span class="dec__count">' + (i + 1) + ' / ' + b.items.length + '</span>' +
          '<h3>' + d.title + '</h3>' + d.text.map(function (p) { return '<p class="body">' + p + '</p>'; }).join('') +
          (d.said ? said(d.said) : '') + '</div></div>', i === 0 ? '' : '');
      });
    } else if (b.type === 'copy') {
      panel('ux-writing', head(b) + '<div class="copy">' + b.items.map(function (c) {
        var wide = c.where === 'Ranks';
        return '<div class="cp' + (wide ? ' cp--wide' : '') + '"><p class="cp__where">' + c.where + '</p>' +
          '<p class="cp__ar" lang="ar" dir="rtl">' + c.ar + '</p><p class="cp__en">' + c.en + '</p>' +
          '<p class="cp__why">' + c.why + '</p></div>';
      }).join('') + '</div>');
    } else if (b.type === 'feedback') {
      var many = b.items.length > 2;
      panel(b.num === '07' ? 'how-it-spread' : 'what-players-said',
        head(b) + '<div class="fb' + (many ? ' fb--masonry' : '') + '">' + b.items.map(msg).join('') + '</div>');
    } else if (b.type === 'outcome') {
      panel('real-numbers', head(b) + '<div class="out"><div class="stats">' + b.items.map(function (s, i) {
        return '<div class="stat"><p class="stat__v">' + s.value + '</p><p class="stat__l">' + s.label + '</p></div>';
      }).join('') + '</div><figure>' + img(b.image, 'board') + '<figcaption>' + b.image.caption + '</figcaption></figure></div>');
    } else if (b.type === 'section') {
      var last = cs.blocks[cs.blocks.length - 1];
      panel('what-i-learned', head(b) + '<div class="learn">' + b.body.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        '<div class="end"><p class="end__q">' + last.text + '</p>' +
        '<p><span class="end__play">Play Klaxs <span class="end__url">ruyinqc.com/klaxs</span></span></p>' +
        '<p class="end__credit">' + cs.projects[0].text + '<br>Designed and built by Mariam Emad Nabih · ' + cs.meta.Role.note + '</p></div>');
    }
  });
})();
</script>
</body>
</html>
